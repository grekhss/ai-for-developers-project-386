openapi: 3.0.0
info:
  title: Календарь встреч
  version: 0.0.0
tags: []
paths:
  /api/admin/meetings:
    get:
      operationId: listPlannedMeetings
      description: |-
        Все запланированные встречи одним списком: сегодня и будущее, по возрастанию
        (date, time), без 14-дневного горизонта. Только админ.
      parameters: []
      responses:
        '200':
          description: 'Все запланированные встречи для админа (S4): сегодня и будущее, без горизонта.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlannedMeeting'
        '403':
          description: 'Нет прав: роль не admin (ADR-0010).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Список типов встреч. Гость видит только активные, админ — все (Q2/Q7).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
    post:
      operationId: createMeetingType
      description: Создание типа встречи. Только админ.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Нет прав: роль не admin (ADR-0010).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeDraft'
  /api/meeting-types/{id}/deactivate:
    post:
      operationId: deactivateMeetingType
      description: Деактивация типа; удаления нет (Q7). Только админ.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Нет прав: роль не admin (ADR-0010).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/meetings:
    get:
      operationId: listMeetings
      description: Записи за полуинтервал дат, обе границы включительно, в порядке возрастания (date, time).
      parameters:
        - name: from
          in: query
          required: true
          description: День начала, включительно, 'YYYY-MM-DD'.
          schema:
            type: string
          explode: false
        - name: to
          in: query
          required: true
          description: День конца, включительно, 'YYYY-MM-DD'.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMeeting
      description: |-
        Создание записи. Формат — 400; занятый слот — 409 (UNIQUE(date, time) в базе).
        Выбор несуществующего/деактивированного типа — тоже 400. Домен — 400
        (прошедшее/выходное/вне окна/сетка/уже начавшийся слот) по ADR-0009.
        `booker_name` берётся из тела и обязателен; роль определяется по cookie `role`.
        Возвращает запись с присвоенным id.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingDraft'
components:
  schemas:
    DateRange:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: День начала, включительно, 'YYYY-MM-DD'.
        to:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: День конца, включительно, 'YYYY-MM-DD'.
      description: Полуинтервал дат для запроса списка записей, обе границы включительно.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      description: 'Форма всех ошибок API: русское описание уходит клиенту как есть.'
    Meeting:
      type: object
      required:
        - id
        - date
        - time
      properties:
        id:
          type: string
          description: Идентификатор, присваиваемый базой данных.
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: День встречи, 'YYYY-MM-DD'.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Начало встречи, 'HH:mm'.
      description: |-
        Записи на встречи.

        Роль определяется по cookie `role`: `/admin` → `admin`, остальное → `guest`
        (клиент ставит её по URL; сервер не проверяет пароли и не выдает сессий).
        Админские ручки требуют роль `admin` (иначе 403).

        Доменные правила букинга — окно 14 дней, прошедшие даты, выходные, сетка
        времени — сервер проверяет (ADR-0009, server/booking-rules.ts). Формат
        проверяется по сгенерированным схемам через `ajv` (K4); целостность —
        несуществующий или деактивированный тип, корректное имя записавшегося из тела
        (S5/C1). Русские тексты ошибок — в `server/routes.ts`.Запись на встречу. Дата и время — строки в том формате, в котором их отдаёт
        Mantine: 'YYYY-MM-DD' и 'HH:mm'.
    MeetingDraft:
      type: object
      required:
        - date
        - time
        - booker_name
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: День встречи, 'YYYY-MM-DD'.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Начало встречи, 'HH:mm'.
        booker_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: |-
            Имя записавшегося: непустая строка без пробельных только из пробелов,
            не длиннее 100 символов.
        meeting_type_id:
          type: string
          description: |-
            Тип встречи. Если поле передано — тип обязан существовать и быть активным,
            иначе 400; без поля запись создаётся «нетипизированной».
      description: |-
        Данные новой записи — всё, кроме идентификатора.
        Имя записавшегося `booker_name` передаётся из формы (не из сессии).
    MeetingType:
      type: object
      required:
        - id
        - name
        - description
        - duration_minutes
        - active
      properties:
        id:
          type: string
          description: Идентификатор, присваиваемый базой данных.
        name:
          type: string
          minLength: 1
          description: Название типа — непустая строка.
        description:
          type: string
          description: Описание типа.
        duration_minutes:
          type: integer
          format: int32
          minimum: 30
          maximum: 180
          description: |-
            Длительность встречи этого типа в минутах: 30–180, кратно 30. Кратность
            тридцати проверяет роут; информационное поле: сетку слотов и занятость
            оно не меняет (ADR-0008).
        active:
          type: boolean
          description: 'Активен ли тип: деактивированный нельзя выбрать при новой записи (Q7).'
      description: |-
        Тип встречи, предлагаемый администратором (Q2). Удаления нет: деактивация —
        единственный конец жизненного цикла (Q7).
    MeetingTypeDraft:
      type: object
      required:
        - name
        - description
        - duration_minutes
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          description: Название типа — непустая строка, минимум один непробельный символ.
        description:
          type: string
          description: Описание типа.
        duration_minutes:
          type: integer
          format: int32
          minimum: 30
          maximum: 180
          description: 'Длительность встреч этого типа в минутах: 30–180, кратно 30.'
      description: Данные нового типа встречи — всё, кроме идентификатора и признака активности.
    NoContent:
      type: object
    PlannedMeeting:
      type: object
      required:
        - date
        - time
        - type
        - booker
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: День встречи, 'YYYY-MM-DD'.
        time:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: Начало встречи, 'HH:mm'.
        type:
          type: string
          nullable: true
          description: Название типа встречи; null у старой записи без типа.
        booker:
          type: string
          nullable: true
          description: Имя записавшегося; null у старой записи без booker.
      description: |-
        Строка админского списка запланированных встреч: LEFT JOIN, поэтому у старых
        «нетипизированных» записей `type` и `booker` равны null (C5).
